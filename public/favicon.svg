<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#060c1a" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Pure Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="6" opacity="0.85" />

  <!-- Outer 360-degree Speed Dial Arc -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.35" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 24" opacity="0.4" />

  <!-- 360 Degree Orbit Ring Accent -->
  <path d="M 90 280 A 190 190 0 1 1 422 280" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#cyanGlow)" />
  
  <!-- Sleek High-Performance Sports Car Silhouette -->
  <g transform="translate(0, -10)">
    <!-- Aerodynamic Roofline & Windshield -->
    <path d="M 148 240 C 176 160, 218 135, 256 135 C 294 135, 336 160, 364 240 Z" 
          fill="none" stroke="url(#silverGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Windshield Divider / Tint Accent -->
    <path d="M 256 142 L 256 235" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.5" stroke-linecap="round" />
    <path d="M 195 210 Q 256 195 317 210" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />

    <!-- Muscular Car Body Shoulder Line -->
    <path d="M 85 272 C 120 252, 175 245, 256 245 C 337 245, 392 252, 427 272 C 438 277, 442 292, 432 300 C 400 326, 335 340, 256 340 C 177 340, 112 326, 80 300 C 70 292, 74 277, 85 272 Z" 
          fill="#0c1730" stroke="url(#cyanBlueGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Aggressive Headlight Accents -->
    <polygon points="102,282 142,274 136,290 96,294" fill="#00f0ff" filter="url(#cyanGlow)" />
    <polygon points="410,282 370,274 376,290 416,294" fill="#00f0ff" filter="url(#cyanGlow)" />

    <!-- Center Radiator Grille / Air Dam -->
    <path d="M 195 296 L 317 296 L 305 322 L 207 322 Z" fill="#040914" stroke="#00b4d8" stroke-width="2" />
  </g>

  <!-- AUTO 360 Bottom Badge Emblem -->
  <!-- "AUTO" Micro Tag -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="9" fill="#94a3b8">AUTO</text>

  <!-- "360" High-Voltage Glowing Monogram -->
  <text x="256" y="446" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="950" font-size="74" letter-spacing="4" fill="url(#cyanGrad)" filter="url(#cyanGlow)">360</text>

  <!-- Precision Automotive Crosshairs / Axis Points -->
  <circle cx="256" cy="40" r="4" fill="#00f0ff" />
  <circle cx="256" cy="472" r="4" fill="#00f0ff" />
  <circle cx="40" cy="256" r="4" fill="#00f0ff" />
  <circle cx="472" cy="256" r="4" fill="#00f0ff" />
</svg>
