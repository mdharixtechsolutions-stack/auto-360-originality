<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Sapphire to Royal Azure -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="40%" stop-color="#1c2541" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Vibrant Electric Cyan to Sky Blue -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Dynamic 360 Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Pure Chrome Titanium Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Rounded Badge Base -->
  <rect width="512" height="512" rx="116" fill="url(#badgeBg)" />
  <!-- Inner Border Rim -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.8" />

  <!-- 360 Orbit Loop (Behind the car) -->
  <ellipse cx="256" cy="275" rx="215" ry="95" fill="none" stroke="url(#orbitGrad)" stroke-width="12" 
           transform="rotate(-22 256 275)" stroke-dasharray="720 220" stroke-linecap="round" filter="url(#glow)" />

  <!-- High-Precision Aerodynamic Supercar -->
  <g transform="translate(0, -10)">
    <!-- Aerodynamic Canopy / Cockpit -->
    <path d="M 148 245 C 182 150, 228 122, 256 122 C 284 122, 330 150, 364 245 Z"
          fill="url(#cockpitGrad)" stroke="url(#chromeGrad)" stroke-width="10" stroke-linejoin="round" />

    <!-- Center Spine Line -->
    <path d="M 256 128 L 256 235" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- Windshield Reflection -->
    <path d="M 185 205 Q 256 190 327 205" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85" />

    <!-- Muscular Front Fascia & Wide Fenders -->
    <path d="M 72 278
             C 108 254, 180 242, 256 242
             C 332 242, 404 254, 440 278
             C 454 287, 452 306, 436 316
             C 390 348, 328 364, 256 364
             C 184 364, 122 348, 76 316
             C 60 306, 58 287, 72 278 Z"
          fill="#0c1735" stroke="url(#chromeGrad)" stroke-width="9" stroke-linejoin="round" />

    <!-- Front Carbon Splitter Blade -->
    <path d="M 116 342 L 256 358 L 396 342 L 412 355 L 256 374 L 100 355 Z"
          fill="url(#cyanGrad)" filter="url(#glow)" />

    <!-- Aggressive LED Headlights (Crisp White with Cyan Halo) -->
    <polygon points="96,288 152,276 142,295 90,301" fill="#00f2fe" filter="url(#glow)" />
    <polygon points="102,290 146,280 138,293 98,297" fill="#ffffff" />

    <polygon points="416,288 360,276 370,295 422,301" fill="#00f2fe" filter="url(#glow)" />
    <polygon points="410,290 366,280 374,293 414,297" fill="#ffffff" />

    <!-- Center Air Intake / Grille Accent -->
    <path d="M 188 300 L 324 300 L 308 328 L 204 328 Z" fill="#050a16" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- 360 Orbit Loop (In front / lower swoop) -->
  <path d="M 90 320 C 130 405, 230 435, 335 410 C 390 395, 430 360, 450 315"
        fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="450" cy="315" r="9" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="450" cy="315" r="4.5" fill="#ffffff" />

  <!-- Clean, Elegant 360° Pill Badge at Lower Center -->
  <g transform="translate(0, 15)">
    <rect x="186" y="396" width="140" height="44" rx="22" fill="#071329" stroke="url(#cyanGrad)" stroke-width="3.5" />
    <text x="256" y="428" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="28" letter-spacing="3" fill="#ffffff">360°</text>
  </g>
</svg>
